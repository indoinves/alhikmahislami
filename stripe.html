<script src="https://cdn.tailwindcss.com"></script>

    <!-- Container Utama -->
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden p-6 m-4">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-gray-800">Produk Eksklusif</h2>
            <p class="text-gray-500 mt-1">Dapatkan akses instan ke produk digital kami.</p>
        </div>

        <!-- Kartu Produk -->
        <div class="mt-6 border border-gray-200 rounded-lg p-4 flex items-center justify-between bg-gray-50">
            <div>
                <h3 class="font-semibold text-gray-700">Produk Contoh Stripe</h3>
                <p class="text-sm text-gray-500">Lisensi Sekali Bayar</p>
            </div>
            <div class="text-right">
                <span class="text-xl font-bold text-indigo-600">$42.42</span>
            </div>
        </div>

        <!-- Tombol Checkout -->
        <div class="mt-6">
            <button id="checkout-button" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-md flex items-center justify-center space-x-2">
                <span>Bayar Sekarang dengan Stripe</span>
            </button>
        </div>

        <p class="text-xs text-center text-gray-400 mt-4">🔒 Pembayaran aman diproses oleh Stripe</p>
    </div>

    <!-- Script JavaScript untuk Integrasi Stripe Checkout -->
    <script>
        const checkoutButton = document.getElementById('checkout-button');

        checkoutButton.addEventListener('click', async () => {
            checkoutButton.disabled = true;
            checkoutButton.innerText = 'Memproses...';

            try {
                // Panggil endpoint backend Java Anda
                const response = await fetch('http://localhost:4242/create-checkout-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const data = await response.json();

                if (data.url) {
                    // Alihkan pengguna ke halaman Checkout Stripe
                    window.location.href = data.url;
                } else {
                    alert('Gagal membuat sesi pembayaran.');
                    checkoutButton.disabled = false;
                    checkoutButton.innerText = 'Bayar Sekarang dengan Stripe';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi ke server.');
                checkoutButton.disabled = false;
                checkoutButton.innerText = 'Bayar Sekarang dengan Stripe';
            }
        });
    </script>
